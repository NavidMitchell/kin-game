<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kin Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07050a; --cyan:#35e9ff; --red:#ff2d55; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#dfe9ef; font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #game { position:fixed; inset:0; }
  #game canvas { box-shadow:0 0 60px rgba(255,45,85,.25); }
  #touch { position:fixed; inset:0; display:none; pointer-events:none; }
  #touch.on { display:block; }
  .btn { position:absolute; bottom:max(12px, env(safe-area-inset-bottom)); width:64px; height:64px;
    border-radius:50%; border:1px solid rgba(53,233,255,.55); background:rgba(7,5,10,.48);
    color:var(--cyan); font:bold 12px system-ui; pointer-events:auto; user-select:none; -webkit-user-select:none;
    touch-action:none; padding:4px; }
  .btn.held,.btn:active { background:rgba(53,233,255,.35); }
  #bl { left:max(12px, env(safe-area-inset-left)); }
  #br { left:calc(max(12px, env(safe-area-inset-left)) + 76px); }
  #bd { left:calc(max(12px, env(safe-area-inset-left)) + 40px); bottom:calc(max(12px, env(safe-area-inset-bottom)) + 74px); width:52px; height:48px; }
  #ba { right:max(12px, env(safe-area-inset-right)); color:#ff7394; border-color:#ff2d5588; }
  #bj { right:calc(max(12px, env(safe-area-inset-right)) + 76px); }
  #bc { right:calc(max(12px, env(safe-area-inset-right)) + 38px); bottom:calc(max(12px, env(safe-area-inset-bottom)) + 74px); width:76px; height:56px; border-radius:20px; }
  .utility { top:max(8px, env(safe-area-inset-top)); bottom:auto; height:40px; width:70px; border-radius:10px; font-size:11px; }
  #bp { left:calc(50% - 108px); } #bm { left:calc(50% - 35px); } #bf { left:calc(50% + 38px); }
  #rotate { position:fixed; inset:0; z-index:20; background:#07050a; padding:32px; text-align:center;
    align-content:center; color:#dfe9ef; font:18px system-ui; }
  #rotate h1 { color:var(--cyan); font-size:28px; }
  .mobile-controls #game { top:calc(44px + env(safe-area-inset-top)); bottom:calc(76px + env(safe-area-inset-bottom)); }
  .mobile-portrait #touch { display:none; }
  @media (max-height:360px) { .btn { width:56px; height:56px; } #bc,#bd { bottom:76px; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="touch" aria-label="Game controls">
  <button class="btn" id="bl" aria-label="Move left">◀</button>
  <button class="btn" id="br" aria-label="Move right">▶</button>
  <button class="btn" id="bd" aria-label="Crouch">▼</button>
  <button class="btn" id="bj">Jump / Fly</button>
  <button class="btn" id="ba">Shoot</button>
  <button class="btn" id="bc" aria-label="Hold to jump or fly and fire">Fly + Fire</button>
  <button class="btn utility" id="bp" aria-label="Pause">Pause</button>
  <button class="btn utility" id="bm" aria-pressed="false">Music on</button>
  <button class="btn utility" id="bf">Fullscreen</button>
</div>
<div id="rotate" hidden role="status"><h1>Turn your phone sideways</h1><p>Kin Runner plays in landscape.</p><p>Your game is paused while you rotate.</p></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
