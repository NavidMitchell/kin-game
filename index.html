<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kin Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07050a; --cyan:#35e9ff; --red:#ff2d55; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#dfe9ef; font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #game { position:fixed; inset:0; }
  #game canvas { box-shadow:0 0 60px rgba(255,45,85,.25); }
  #touch { position:fixed; inset:0; display:none; pointer-events:none; }
  #touch.on { display:block; }
  .btn { position:absolute; bottom:18px; width:72px; height:72px; border-radius:50%; border:2px solid rgba(53,233,255,.6);
         background:rgba(53,233,255,.12); color:var(--cyan); font:bold 15px system-ui; display:flex; align-items:center; justify-content:center;
         pointer-events:auto; user-select:none; -webkit-user-select:none; }
  .btn:active { background:rgba(53,233,255,.35); }
  #bl { left:18px; } #br { left:104px; } #bd { left:61px; bottom:100px; width:56px; height:56px; font-size:13px; }
  #bj { right:104px; } #ba { right:18px; border-color:rgba(255,45,85,.7); color:var(--red); background:rgba(255,45,85,.12); }
  #bp { top:12px; right:12px; bottom:auto; width:44px; height:44px; font-size:14px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="touch">
  <div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div><div class="btn" id="bd">▼</div>
  <div class="btn" id="bj">JUMP</div><div class="btn" id="ba">SHOOT</div><div class="btn" id="bp">II</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
