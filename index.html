<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kin Runner</title>
<style>
  :root { --bg:#07050a; --cyan:#35e9ff; --red:#ff2d55; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#dfe9ef; font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#000; image-rendering:auto; box-shadow:0 0 60px rgba(255,45,85,.25); }
  #touch { position:fixed; inset:0; display:none; pointer-events:none; }
  #touch.on { display:block; }
  .btn { position:absolute; bottom:18px; width:72px; height:72px; border-radius:50%; border:2px solid rgba(53,233,255,.6);
         background:rgba(53,233,255,.12); color:var(--cyan); font:bold 15px system-ui; display:flex; align-items:center; justify-content:center;
         pointer-events:auto; user-select:none; -webkit-user-select:none; }
  .btn:active { background:rgba(53,233,255,.35); }
  #bl { left:18px; } #br { left:104px; } #bj { right:104px; } #ba { right:18px; border-color:rgba(255,45,85,.7); color:var(--red); background:rgba(255,45,85,.12); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div>
  <div class="btn" id="bj">JUMP</div><div class="btn" id="ba">PUNCH</div>
</div>
<script>
'use strict';
// ---------------------------------------------------------------- assets
// Frame rectangles auto-detected from the alpha channel of assets/robot.png
const FRAMES = {
  idle:   [[299,76,164,210],[514,78,166,208],[735,78,162,207],[946,77,162,209]],
  run:    [[77,328,172,220],[293,331,177,217],[518,333,169,216],[735,330,176,217],[963,332,178,216],[1183,334,199,215]],
  jump:   [[77,660,185,165],[315,588,163,208],[544,594,159,198],[758,592,150,200],[989,589,157,205],[1214,590,161,209]],
  attack: [[86,876,176,169],[304,841,154,203],[539,839,177,203],[732,840,224,203],[988,837,192,207],[1216,838,167,206]],
};
const SPR_SCALE = 0.5;               // sprite sheet px -> world px
const SHEET = new Image(); SHEET.src = 'assets/robot.png';
const CITY  = new Image(); CITY.src  = 'assets/city.png';

// ---------------------------------------------------------------- soft puff sprite (for steam)
const PUFF=document.createElement('canvas'); PUFF.width=PUFF.height=64;
{ const g=PUFF.getContext('2d'), r=g.createRadialGradient(32,32,2,32,32,32);
  r.addColorStop(0,'rgba(255,215,225,1)'); r.addColorStop(.4,'rgba(255,150,175,.4)'); r.addColorStop(1,'rgba(255,100,140,0)');
  g.fillStyle=r; g.fillRect(0,0,64,64); }

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
function fit(){ const s=Math.min(innerWidth/W, innerHeight/H); cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; }
addEventListener('resize', fit); fit();

// ---------------------------------------------------------------- audio (tiny synth)
let AC=null;
function beep(f0,f1,dur,type='square',vol=.08){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const SFX = {
  jump: ()=>beep(300,700,.15,'square'),
  punch:()=>beep(180,60,.12,'sawtooth',.1),
  hitE: ()=>{beep(500,80,.25,'sawtooth',.12); beep(900,120,.2,'square',.05);},
  chip: ()=>beep(900,1500,.12,'sine',.09),
  hurt: ()=>beep(200,40,.4,'sawtooth',.14),
  land: ()=>beep(120,60,.07,'square',.04),
  jet:  ()=>{beep(200,900,.35,'sawtooth',.1); beep(600,1400,.4,'sine',.08);},
};

// ---------------------------------------------------------------- input
const keys = {};
const touchUI = document.getElementById('touch');
addEventListener('keydown', e=>{ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); onAnyPress(e.code); });
addEventListener('keyup',   e=>{ keys[e.code]=false; });
if ('ontouchstart' in window) touchUI.classList.add('on');
function bindBtn(id, code){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault(); keys[code]=true; onAnyPress(code);};
  const off=e=>{e.preventDefault(); keys[code]=false;};
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointerleave',off); el.addEventListener('pointercancel',off);
}
bindBtn('bl','ArrowLeft'); bindBtn('br','ArrowRight'); bindBtn('bj','Space'); bindBtn('ba','KeyJ');
const left  = ()=>keys.ArrowLeft||keys.KeyA;
const right = ()=>keys.ArrowRight||keys.KeyD;
const jumpK = ()=>keys.Space||keys.ArrowUp||keys.KeyW;
const atkK  = ()=>keys.KeyJ||keys.KeyX||keys.KeyZ||keys.KeyK;
let jumpBuffer=0, atkBuffer=0;
function onAnyPress(code){
  if(['Space','ArrowUp','KeyW'].includes(code)) jumpBuffer=.12;
  if(['KeyJ','KeyX','KeyZ','KeyK'].includes(code)) atkBuffer=.15;
  if(game.mode!=='play' && (code==='Enter'||code==='Space'||code==='KeyJ')) { if(game.mode==='over'||game.mode==='title') startGame(); }
}

// ---------------------------------------------------------------- world
const GRAV=2400, RUN=340, JUMP_V=-940, GROUND_Y=468, JET_THRUST=5200, JET_SPEED=460;
const game = { mode:'title', time:0, score:0, best:+(localStorage.getItem('kin_best')||0), hp:3, dist:0, shake:0, flash:0 };
let player, plats, enemies, chips, boosts, parts, steam, cam, genX, lastSafe;

function startGame(){
  game.mode='play'; game.score=0; game.hp=3; game.dist=0; game.time=0; game.shake=0;
  player={x:200,y:GROUND_Y,vx:0,vy:0,w:44,h:100,face:1,ground:false,state:'idle',t:0,atkT:0,atkHit:false,inv:0,coyote:0,landT:0,jet:false,thrust:false};
  plats=[]; enemies=[]; chips=[]; boosts=[]; parts=[]; steam=[]; cam={x:0}; genX=0; lastSafe={x:200};
  // starting ground
  addPlat(-400, GROUND_Y, 1400, 'ground'); genX=1000;
  while(genX < 3000) genChunk();
}
function addPlat(x,y,w,type){ plats.push({x,y,w,h:type==='ground'?200:26,type}); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function genChunk(){
  const r=Math.random();
  if(r<.45){ // ground run with optional platform + enemies/chips
    const w=rnd(500,1100); addPlat(genX,GROUND_Y,w,'ground');
    if(Math.random()<.7){ const px=genX+rnd(100,w-300), py=GROUND_Y-rnd(130,210), pw=rnd(160,300); addPlat(px,py,pw,'float'); spawnChips(px+20,py-40,Math.floor(pw/50)); if(Math.random()<.5) spawnEnemy(px+pw/2,py,pw/2-20,'drone'); }
    if(Math.random()<.75) spawnEnemy(genX+rnd(200,w-200),GROUND_Y,rnd(80,200),'crawler');
    if(Math.random()<.5) spawnChips(genX+rnd(60,w-260),GROUND_Y-60,4);
    if(Math.random()<.35) spawnBoost(genX+rnd(120,w-120),GROUND_Y,Math.random()<.5?'tank':'egg');
    genX+=w+rnd(100,170);                      // gap
  } else if(r<.8){ // stepping platforms over a pit
    let x=genX, y=GROUND_Y-rnd(40,120), n=2+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){ const pw=rnd(130,220); addPlat(x,y,pw,'float'); if(Math.random()<.6) spawnChips(x+pw/2-50,y-50,3); if(i>0&&Math.random()<.4) spawnEnemy(x+pw/2,y-80,pw/2,'drone'); x+=pw+rnd(90,150); y=Math.max(180,Math.min(GROUND_Y-30,y+rnd(-70,60))); }
    genX=x;
  } else { // tall tower with ledges
    const w=rnd(400,600); addPlat(genX,GROUND_Y,w,'ground');
    let y=GROUND_Y-120; for(let i=0;i<3;i++){ const pw=rnd(120,200), px=genX+(i%2?w-pw-30:30); addPlat(px,y,pw,'float'); spawnChips(px+10,y-40,2); if(i===2&&Math.random()<.6) spawnBoost(px+pw/2,y,'egg'); y-=110; }
    spawnEnemy(genX+w/2,GROUND_Y,w/2-40,'crawler'); spawnEnemy(genX+w/2,y+40,w/2-60,'drone');
    genX+=w+rnd(100,170);
  }
}
function spawnBoost(x,y,type){ boosts.push({x,y,type,t:Math.random()*6}); }
function spawnChips(x,y,n){ for(let i=0;i<n;i++) chips.push({x:x+i*48,y:y-Math.sin(i/(n-1||1)*Math.PI)*30,r:11,got:false,t:Math.random()*6}); }
function spawnEnemy(cx,y,range,type){ enemies.push({x:cx,y,type,w:type==='drone'?58:62,h:type==='drone'?42:46,vx:(Math.random()<.5?-1:1)*(type==='drone'?90:70),minX:cx-range,maxX:cx+range,alive:true,t:Math.random()*6,dieT:0}); }
function puff(x,y,n,col,spd=260){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*spd; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:rnd(.3,.8),col,sz:rnd(2,6)}); } }

// ---------------------------------------------------------------- update
function update(dt){
  game.time+=dt; jumpBuffer-=dt; atkBuffer-=dt;
  if(game.mode!=='play') return;
  const p=player;

  // --- attack
  if(atkBuffer>0 && p.state!=='attack'){ atkBuffer=0; p.state='attack'; p.t=0; p.atkHit=false; SFX.punch(); }
  const attacking = p.state==='attack';

  // --- horizontal movement
  const dir=(right()?1:0)-(left()?1:0);
  const target = attacking && p.ground ? 0 : dir*RUN;
  const acc = p.ground? 2600 : 1500;
  if(p.vx<target) p.vx=Math.min(target,p.vx+acc*dt); else if(p.vx>target) p.vx=Math.max(target,p.vx-acc*dt);
  if(dir && !attacking) p.face=dir;

  // --- jump
  p.coyote = p.ground ? .1 : p.coyote-dt;
  if(jumpBuffer>0 && p.coyote>0){ jumpBuffer=0; p.coyote=0; p.vy=JUMP_V; p.ground=false; SFX.jump(); puff(p.x,p.y,6,'#35e9ff',120); }
  p.thrust=false;
  if(p.jet && !p.ground && jumpK()){        // jet booster: hold jump to fly
    p.thrust=true; p.vy=Math.max(-JET_SPEED, p.vy-JET_THRUST*dt);
    if(Math.random()<.9) parts.push({x:p.x-p.face*14+rnd(-6,6),y:p.y-8,vx:-p.face*rnd(40,120)+p.vx*.3,vy:rnd(220,420),life:rnd(.15,.35),col:Math.random()<.5?'#35e9ff':'#e9fdff',sz:rnd(3,8)});
  } else {
    if(!jumpK() && p.vy<-300 && !p.jet) p.vy=-300;   // variable jump height
    p.vy=Math.min(p.vy+GRAV*dt, 1500);
  }
  if(p.jet && p.y<80){ p.y=80; p.vy=Math.max(0,p.vy); }

  // --- integrate + platform collisions (feet at p.y; body box above)
  const prevY=p.y;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  const wasGround=p.ground; p.ground=false;
  if(p.vy>=0){
    for(const pl of plats){
      if(p.x+p.w/2-8>pl.x && p.x-p.w/2+8<pl.x+pl.w && prevY<=pl.y+1 && p.y>=pl.y){ p.y=pl.y; p.vy=0; p.ground=true; break; }
    }
  }
  if(p.ground && !wasGround){ p.landT=.12; SFX.land(); if(plats.some(pl=>pl.type==='ground'&&p.x>pl.x+40&&p.x<pl.x+pl.w-40&&p.y===pl.y)) lastSafe={x:p.x}; }
  if(p.ground && p.x>lastSafe.x && plats.some(pl=>pl.type==='ground'&&p.x>pl.x+60&&p.x<pl.x+pl.w-60&&p.y===pl.y)) lastSafe={x:p.x};
  p.landT-=dt; p.inv-=dt; p.t+=dt;
  if(p.x<cam.x+30){ p.x=cam.x+30; p.vx=Math.max(0,p.vx); }

  // --- fell off
  if(p.y>H+120){ hurt(true); }

  // --- state machine
  if(attacking){ if(p.t>.42) p.state='idle'; }
  if(p.state!=='attack'){ p.state = !p.ground ? 'jump' : Math.abs(p.vx)>20 ? 'run' : 'idle'; }

  // --- camera
  const look=p.face*120;
  cam.x += ((p.x+look-W*.38)-cam.x)*Math.min(1,dt*4);
  cam.x=Math.max(cam.x, p.x-W*.6);
  game.dist=Math.max(game.dist, Math.floor(p.x/10));
  game.shake=Math.max(0,game.shake-dt*3);

  // --- generation + pruning
  while(genX < cam.x+W+1200) genChunk();
  plats=plats.filter(o=>o.x+o.w>cam.x-600); enemies=enemies.filter(o=>o.x>cam.x-600); chips=chips.filter(o=>o.x>cam.x-300&&!o.got); boosts=boosts.filter(o=>o.x>cam.x-300);

  // --- attack hitbox
  let hb=null;
  if(attacking && p.t>.1 && p.t<.3) hb={x:p.face>0?p.x+10:p.x-100, y:p.y-100, w:90, h:70};

  // --- enemies
  for(const e of enemies){
    e.t+=dt;
    if(!e.alive){ e.dieT+=dt; continue; }
    e.x+=e.vx*dt; if(e.x<e.minX){e.x=e.minX;e.vx=Math.abs(e.vx);} if(e.x>e.maxX){e.x=e.maxX;e.vx=-Math.abs(e.vx);}
    const ey = e.type==='drone' ? e.y-60+Math.sin(e.t*2.5)*12 : e.y-e.h;   // top of enemy box
    const box={x:e.x-e.w/2,y:ey,w:e.w,h:e.h};
    if(hb && overlap(hb,box)){ killEnemy(e,p.face); continue; }
    const pb={x:p.x-p.w/2+8,y:p.y-p.h,w:p.w-16,h:p.h};
    if(overlap(pb,box)){
      if(p.vy>200 && p.y-20 < box.y+box.h*.6){ killEnemy(e,0); p.vy=JUMP_V*.6; }
      else if(p.inv<=0) hurt(false, e.x<p.x?1:-1);
    }
  }
  enemies=enemies.filter(e=>e.alive||e.dieT<.4);

  // --- chips
  for(const c of chips){ c.t+=dt; if(Math.hypot(c.x-p.x,c.y-(p.y-50))<c.r+34){ c.got=true; game.score+=10; SFX.chip(); puff(c.x,c.y,8,'#35e9ff',160); } }

  // --- boosters (tanks / eggs)
  for(const b of boosts){ b.t+=dt; if(Math.abs(b.x-p.x)<40 && Math.abs((b.y-30)-(p.y-50))<70){ b.got=true; p.jet=true; game.score+=50; SFX.jet(); game.shake=.25; puff(b.x,b.y-30,26,'#35e9ff',300); puff(b.x,b.y-30,10,'#ffffff',180); } }
  boosts=boosts.filter(b=>!b.got);

  // --- particles
  for(const q of parts){ q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=900*dt; }
  parts=parts.filter(q=>q.life>0);

  // --- steam rising from pits between ground segments
  updateSteam(dt);
}
function groundGaps(){
  const g=plats.filter(pl=>pl.type==='ground').sort((a,b)=>a.x-b.x), out=[];
  for(let i=0;i<g.length-1;i++){ const x0=g[i].x+g[i].w, x1=g[i+1].x; if(x1-x0>30) out.push([x0,x1]); }
  return out;
}
function updateSteam(dt){
  for(const [x0,x1] of groundGaps()){
    if(x1<cam.x-100||x0>cam.x+W+100) continue;
    let n=Math.max(170,Math.min(x1-x0,420))*dt*.045; while(n>0){ if(Math.random()<n) steam.push({x:rnd(x0+8,x1-8),y:GROUND_Y+rnd(70,150),vx:rnd(-10,10),vy:rnd(-60,-100),life:rnd(1.8,3),max:0,sz:rnd(10,20),ph:Math.random()*6}); n-=1; }
  }
  for(const q of steam){ if(!q.max) q.max=q.life; q.life-=dt; q.y+=q.vy*dt; q.x+=(q.vx+Math.sin(game.time*1.5+q.ph)*10)*dt; q.vy*=1-dt*.3; q.sz+=12*dt; }
  steam=steam.filter(q=>q.life>0 && q.x>cam.x-80 && q.x<cam.x+W+80);
  if(steam.length>220) steam.splice(0,steam.length-220);
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function killEnemy(e,dir){ e.alive=false; game.score+=100; SFX.hitE(); game.shake=.35; const ey=e.type==='drone'?e.y-40:e.y-20; puff(e.x,ey,22,'#ff2d55',320); puff(e.x,ey,10,'#ffd1dc',200); }
function hurt(fell,dir=0){
  const p=player; game.hp--; SFX.hurt(); game.shake=.6; game.flash=.25;
  if(p.jet){ p.jet=false; p.thrust=false; puff(p.x,p.y-50,30,'#35e9ff',380); puff(p.x,p.y-50,12,'#ff2d55',250); }
  if(game.hp<=0){ game.mode='over'; if(game.score>game.best){ game.best=game.score; localStorage.setItem('kin_best',game.best); } return; }
  if(fell){ p.x=lastSafe.x; p.y=GROUND_Y-20; p.vy=0; p.vx=0; cam.x=Math.min(cam.x,p.x-200); }
  else { p.vy=-500; p.vx=dir*420; p.ground=false; }
  p.inv=1.4; p.state='jump';
}

// ---------------------------------------------------------------- render
function draw(){
  ctx.save();
  if(game.shake>0){ ctx.translate((Math.random()-.5)*game.shake*18,(Math.random()-.5)*game.shake*18); }
  drawBackground();
  if(game.mode!=='title'){ drawPlatforms(); drawSteam(); drawChips(); drawBoosts(); drawEnemies(); drawPlayer(); drawParticles(); }
  ctx.restore();
  if(game.flash>0){ ctx.fillStyle=`rgba(255,45,85,${game.flash})`; ctx.fillRect(0,0,W,H); game.flash-=1/60; }
  drawHUD();
}
function drawBackground(){
  const cx = cam ? cam.x : game.time*40;
  ctx.fillStyle='#07050a'; ctx.fillRect(0,0,W,H);
  if(CITY.complete && CITY.naturalWidth){
    const s=H/CITY.naturalHeight, bw=CITY.naturalWidth*s;
    // far layer (dim, slow)
    ctx.globalAlpha=.55; let ox=-((cx*.15)%bw); for(let x=ox-bw;x<W+bw;x+=bw) ctx.drawImage(CITY,x,-40,bw,H);
    // near layer
    ctx.globalAlpha=1; ox=-((cx*.4)%bw); for(let x=ox-bw;x<W+bw;x+=bw) ctx.drawImage(CITY,x,0,bw,H);
  }
  // fog gradient near ground
  const g=ctx.createLinearGradient(0,H*.55,0,H); g.addColorStop(0,'rgba(7,5,10,0)'); g.addColorStop(1,'rgba(7,5,10,.85)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawPlatforms(){
  for(const pl of plats){
    const x=pl.x-cam.x, y=pl.y; if(x>W||x+pl.w<0) continue;
    if(pl.type==='ground'){
      ctx.fillStyle='#0b0a10'; ctx.fillRect(x,y,pl.w,pl.h);
      ctx.fillStyle='#16121c'; ctx.fillRect(x,y,pl.w,10);
      ctx.fillStyle='#ff2d55'; ctx.shadowColor='#ff2d55'; ctx.shadowBlur=14; ctx.fillRect(x,y,pl.w,3); ctx.shadowBlur=0;
      // panel seams
      ctx.strokeStyle='rgba(255,45,85,.18)'; ctx.lineWidth=1;
      for(let s=Math.floor(x/120)*120;s<x+pl.w;s+=120){ if(s>x){ ctx.beginPath(); ctx.moveTo(s,y+10); ctx.lineTo(s-14,y+60); ctx.stroke(); } }
    } else {
      ctx.fillStyle='#0f0c15'; ctx.fillRect(x,y,pl.w,pl.h);
      ctx.fillStyle='#35e9ff'; ctx.shadowColor='#35e9ff'; ctx.shadowBlur=12; ctx.fillRect(x,y,pl.w,3); ctx.shadowBlur=0;
      ctx.fillStyle='rgba(53,233,255,.25)'; ctx.fillRect(x+6,y+pl.h-5,pl.w-12,2);
      ctx.fillStyle='rgba(53,233,255,.08)'; ctx.fillRect(x,y+3,pl.w,8);
    }
  }
}
function drawBoosts(){
  for(const b of boosts){ const x=b.x-cam.x, y=b.y+Math.sin(b.t*2.5)*3; if(x<-60||x>W+60) continue;
    ctx.save(); ctx.translate(x,y); ctx.shadowColor='#35e9ff'; ctx.shadowBlur=18;
    if(b.type==='tank'){
      ctx.fillStyle='#0e1a1f'; rr(-13,-52,26,52,7); ctx.fill();
      ctx.fillStyle='#35e9ff'; ctx.fillRect(-13,-40,26,4); ctx.fillRect(-13,-22,26,4); rr(-5,-58,10,8,3); ctx.fill();
      ctx.fillStyle='rgba(53,233,255,.35)'; ctx.fillRect(-9,-48,5,42);
      ctx.shadowBlur=0; ctx.fillStyle='#e9fdff'; ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('JET',0,-31);
    } else {
      const pulse=.6+Math.sin(b.t*4)*.4;
      ctx.fillStyle='#1a0c14'; ctx.beginPath(); ctx.ellipse(0,-30,18,28,0,0,Math.PI*2); ctx.fill();
      ctx.shadowColor='#ff2d55'; ctx.shadowBlur=10+pulse*14; ctx.strokeStyle='#ff2d55'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-14,-40); ctx.lineTo(-4,-28); ctx.lineTo(-10,-14); ctx.moveTo(6,-50); ctx.lineTo(12,-34); ctx.lineTo(4,-20); ctx.stroke();
      ctx.shadowColor='#35e9ff'; ctx.shadowBlur=16; ctx.fillStyle=`rgba(53,233,255,${pulse})`; ctx.beginPath(); ctx.ellipse(0,-30,6,9,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore(); }
}
function drawSteam(){
  // faint glow at the floor of each pit
  for(const [x0,x1] of groundGaps()){ const sx=x0-cam.x; if(sx>W||sx+(x1-x0)<0) continue;
    const g=ctx.createLinearGradient(0,H-90,0,H); g.addColorStop(0,'rgba(255,45,85,0)'); g.addColorStop(1,'rgba(255,45,85,.16)');
    ctx.fillStyle=g; ctx.fillRect(sx,H-90,x1-x0,90); }
  for(const q of steam){
    const k=q.life/q.max, a=Math.sin(k*Math.PI)*.11;      // fade in, then out
    ctx.globalAlpha=a; const d=q.sz*2; ctx.drawImage(PUFF,q.x-cam.x-q.sz,q.y-q.sz,d,d);
  }
  ctx.globalAlpha=1;
}
function drawChips(){
  for(const c of chips){ const x=c.x-cam.x,y=c.y+Math.sin(c.t*3)*4; if(x<-30||x>W+30) continue;
    const sx=Math.abs(Math.cos(c.t*2.2)); ctx.save(); ctx.translate(x,y); ctx.scale(sx*.9+.1,1);
    ctx.shadowColor='#35e9ff'; ctx.shadowBlur=16; ctx.fillStyle='#35e9ff';
    ctx.beginPath(); ctx.moveTo(0,-c.r); ctx.lineTo(c.r,0); ctx.lineTo(0,c.r); ctx.lineTo(-c.r,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#e9fdff'; ctx.beginPath(); ctx.moveTo(0,-c.r*.45); ctx.lineTo(c.r*.45,0); ctx.lineTo(0,c.r*.45); ctx.lineTo(-c.r*.45,0); ctx.closePath(); ctx.fill();
    ctx.restore(); }
}
function drawEnemies(){
  for(const e of enemies){
    const x=e.x-cam.x; if(x<-100||x>W+100) continue;
    if(!e.alive){ continue; }
    ctx.save();
    if(e.type==='drone'){
      const y=e.y-60+Math.sin(e.t*2.5)*12+e.h/2; ctx.translate(x,y); if(e.vx<0) ctx.scale(-1,1);
      ctx.shadowColor='#ff2d55'; ctx.shadowBlur=18;
      ctx.fillStyle='#120b10'; rr(-29,-20,58,40,8); ctx.fill();
      ctx.fillStyle='#ff2d55'; ctx.fillRect(-18,-6,10,6); ctx.fillRect(2,-6,16,6); // eyes
      ctx.fillRect(-29,14,58,3);
      ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,45,85,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-34,-24); ctx.lineTo(-24,-12); ctx.moveTo(34,-24); ctx.lineTo(24,-12); ctx.stroke();
      // thruster
      ctx.fillStyle=`rgba(255,80,110,${.5+Math.sin(e.t*30)*.3})`; ctx.beginPath(); ctx.moveTo(-10,20); ctx.lineTo(10,20); ctx.lineTo(0,34+Math.random()*8); ctx.closePath(); ctx.fill();
    } else {
      const y=e.y; ctx.translate(x,y); if(e.vx<0) ctx.scale(-1,1);
      const b=Math.sin(e.t*10)*3;
      ctx.shadowColor='#ff2d55'; ctx.shadowBlur=14;
      ctx.fillStyle='#120b10'; rr(-31,-46+b,62,36,10); ctx.fill();
      ctx.fillStyle='#1c1218'; ctx.fillRect(-26,-12,16,12); ctx.fillRect(10,-12,16,12); // treads
      ctx.fillStyle='#ff2d55'; ctx.fillRect(4,-36+b,18,7); ctx.fillRect(-20,-36+b,8,7);
      ctx.fillRect(-26,-6,16,3); ctx.fillRect(10,-6,16,3);
      ctx.shadowBlur=0; ctx.strokeStyle='#ff2d55'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(30,-30+b); ctx.lineTo(44,-24+b); ctx.stroke(); // claw
    }
    ctx.restore();
  }
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function currentFrame(p){
  if(p.state==='attack'){ const i=Math.min(5,Math.floor(p.t/.42*6)); return FRAMES.attack[i]; }
  if(p.state==='jump' && p.thrust) return FRAMES.jump[3];
  if(p.state==='jump'){ let i; if(p.vy<-500)i=1; else if(p.vy<-150)i=2; else if(p.vy<150)i=3; else if(p.vy<600)i=4; else i=5; return FRAMES.jump[i]; }
  if(p.landT>0) return FRAMES.jump[0];
  if(p.state==='run'){ return FRAMES.run[Math.floor(p.t*12)%6]; }
  return FRAMES.idle[Math.floor(p.t*5)%4];
}
function drawPlayer(){
  const p=player; if(!SHEET.complete) return;
  if(p.inv>0 && Math.floor(p.inv*14)%2===0) return;  // blink
  const f=currentFrame(p), dw=f[2]*SPR_SCALE, dh=f[3]*SPR_SCALE;
  ctx.save(); ctx.translate(p.x-cam.x, p.y); ctx.scale(p.face,1);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(0,2,28,6,0,0,Math.PI*2); ctx.fill();
  if(p.jet){ // jet pack on the back
    ctx.shadowColor='#35e9ff'; ctx.shadowBlur=14; ctx.fillStyle='#0e1a1f'; rr(-34,-78,16,40,5); ctx.fill();
    ctx.fillStyle='#35e9ff'; ctx.fillRect(-34,-66,16,3); ctx.fillRect(-34,-52,16,3);
    if(p.thrust){ const fl=22+Math.random()*18; ctx.fillStyle='#35e9ff'; ctx.beginPath(); ctx.moveTo(-33,-38); ctx.lineTo(-19,-38); ctx.lineTo(-26,-38+fl); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.moveTo(-30,-38); ctx.lineTo(-22,-38); ctx.lineTo(-26,-38+fl*.5); ctx.closePath(); ctx.fill(); }
    else { ctx.fillStyle=`rgba(53,233,255,${.4+Math.sin(game.time*12)*.3})`; ctx.fillRect(-30,-38,8,4); }
    ctx.shadowBlur=0;
  }
  ctx.drawImage(SHEET, f[0],f[1],f[2],f[3], -dw/2, -dh, dw, dh);
  ctx.restore();
}
function drawParticles(){ for(const q of parts){ ctx.globalAlpha=Math.min(1,q.life*2); ctx.fillStyle=q.col; ctx.fillRect(q.x-cam.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz); } ctx.globalAlpha=1; }
function drawHUD(){
  ctx.textBaseline='top';
  if(game.mode==='play'||game.mode==='over'){
    ctx.font='bold 22px system-ui'; ctx.fillStyle='#35e9ff'; ctx.shadowColor='#35e9ff'; ctx.shadowBlur=10;
    ctx.textAlign='left'; ctx.fillText('SCORE '+game.score, 20, 16);
    ctx.textAlign='center'; ctx.fillText(game.dist+' m', W/2, 16);
    if(player.jet){ ctx.fillStyle=`rgba(53,233,255,${.7+Math.sin(game.time*6)*.3})`; ctx.font='bold 16px system-ui'; ctx.fillText('JET ONLINE  ·  hold jump to fly', W/2, 44); ctx.font='bold 22px system-ui'; }
    ctx.textAlign='right'; for(let i=0;i<3;i++){ ctx.fillStyle=i<game.hp?'#35e9ff':'rgba(53,233,255,.18)'; ctx.fillRect(W-20-(i*30)-22,18,22,22); }
    ctx.shadowBlur=0;
  }
  if(game.mode==='title'||game.mode==='over'){
    ctx.fillStyle='rgba(7,5,10,.72)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font='900 72px system-ui'; ctx.fillStyle='#35e9ff'; ctx.shadowColor='#35e9ff'; ctx.shadowBlur=30;
    ctx.fillText(game.mode==='title'?'KIN RUNNER':'SIGNAL LOST', W/2, 130);
    ctx.shadowBlur=0; ctx.font='20px system-ui'; ctx.fillStyle='#dfe9ef';
    if(game.mode==='over'){ ctx.fillText('Score '+game.score+'   ·   Distance '+game.dist+' m   ·   Best '+game.best, W/2, 230); }
    else { ctx.fillText('Run the neon grid. Punch the red drones. Grab a fuel tank or egg to fly.', W/2, 230); }
    ctx.fillStyle='#ff2d55'; ctx.font='bold 18px system-ui';
    ctx.fillText('← →  /  A D   move        SPACE / W / ↑   jump        J / X / Z   punch', W/2, 300);
    ctx.fillText('Stomp or punch enemies   ·   Jet booster lasts until you get hit', W/2, 332);
    const blink=Math.floor(game.time*2)%2===0; if(blink){ ctx.fillStyle='#fff'; ctx.font='bold 26px system-ui'; ctx.fillText(game.mode==='title'?'PRESS SPACE / ENTER TO START':'PRESS SPACE / ENTER TO RETRY', W/2, 420); }
    if(game.best && game.mode==='title'){ ctx.fillStyle='#35e9ff'; ctx.font='16px system-ui'; ctx.fillText('BEST '+game.best, W/2, 470); }
    // title-screen robot
    if(SHEET.complete && SHEET.naturalWidth && game.mode==='title'){ const f=FRAMES.idle[Math.floor(game.time*5)%4]; const dh=f[3]*.6, dw=f[2]*.6; ctx.drawImage(SHEET,f[0],f[1],f[2],f[3],W/2-dw/2,H-dh-50,dw,dh); }
  }
}

// ---------------------------------------------------------------- loop
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); draw(); requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', ()=>{ if(game.mode!=='play') startGame(); });
requestAnimationFrame(frame);
</script>
