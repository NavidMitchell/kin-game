<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall texture generator</title>
<style>
  body { margin: 0; padding: 24px; background: #111; color: #ccc; font: 14px system-ui, sans-serif; }
  canvas { display: block; margin: 12px 0; image-rendering: auto; }
  #tiled { width: 1024px; height: 512px; background-size: 512px 512px; outline: 1px solid #333; }
  a { color: #35e9ff; }
</style>
</head>
<body>
<!--
  Renders assets/wall.webp: a seamless 512x512 tower facade used for the body of solid ground.
  Neutral greys with near-white window light; the game tints it per level (multiply), so lit windows
  take the level colour. Open this file in a browser and click "Download", or replace assets/wall.webp
  with any other seamless 512x512 texture (painted, AI-generated...) — the game only needs the file.
-->
<p>assets/wall.webp generator — seed <input id="seed" type="number" value="11" style="width:70px"> <button id="go">Render</button> <a id="dl" download="wall.webp">Download</a></p>
<canvas id="out" width="512" height="512"></canvas>
<p>Tiled preview (checks the seams):</p>
<div id="tiled"></div>
<script>
const S = 512, STOREY = 64, BAY = 128;

function render(seed) {
  let st = seed >>> 0 || 1;
  const rand = () => (st = (st * 16807) % 2147483647) / 2147483647;
  const pick = (a, b) => a + rand() * (b - a);

  // periodic value noise (wraps at the tile size, so the grime tiles seamlessly)
  function noiseLayer(cells) {
    const g = Array.from({ length: cells * cells }, rand), at = (x, y) => g[((y % cells + cells) % cells) * cells + ((x % cells + cells) % cells)];
    return (x, y) => {
      const fx = x / S * cells, fy = y / S * cells, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const a = at(x0, y0) + (at(x0 + 1, y0) - at(x0, y0)) * sx, b = at(x0, y0 + 1) + (at(x0 + 1, y0 + 1) - at(x0, y0 + 1)) * sx;
      return a + (b - a) * sy;
    };
  }
  const n1 = noiseLayer(4), n2 = noiseLayer(16), n3 = noiseLayer(64), streak = noiseLayer(32);

  // ---- plan the facade once (seeded), then draw it 3x3 so glows and shadows wrap across the edges
  const windows = [], units = [], pipes = [];
  for (let y = 0; y < S; y += STOREY) for (let bx = 0; bx < S; bx += BAY) {
    for (let i = 0; i < 4; i++) {
      const r = rand();
      windows.push({
        x: bx + 16 + i * 28, y: y + 16, w: 20, h: 36,
        lit: r < .16 ? pick(.85, 1) : r < .38 ? pick(.35, .6) : r < .5 ? pick(.12, .22) : 0,
        warm: rand(), blinds: rand() < .25, half: rand() < .15, figure: rand() < .05,
      });
    }
    if (rand() < .35) units.push({ x: bx + 16 + Math.floor(rand() * 4) * 28 - 2, y: y + 54 });
  }
  pipes.push({ x: BAY * 3 - 3 });   // runs down the column between two bays

  const c = document.createElement('canvas'); c.width = c.height = S * 3;
  const ctx = c.getContext('2d');

  // base material with grime (per pixel, already periodic)
  const img = ctx.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const v = .55 * n1(x, y) + .3 * n2(x, y) + .15 * n3(x, y);
    const drip = Math.max(0, streak(x * 1, y * .08) - .55) * 1.6;        // vertical rain streaks
    const k = 22 + v * 14 - drip * 10;
    const i = (y * S + x) * 4; d[i] = k * .92; d[i + 1] = k * .95; d[i + 2] = k * 1.12; d[i + 3] = 255;
  }
  const base = document.createElement('canvas'); base.width = base.height = S; base.getContext('2d').putImageData(img, 0, 0);
  for (let oy = 0; oy < 3; oy++) for (let ox = 0; ox < 3; ox++) ctx.drawImage(base, ox * S, oy * S);

  const draw = (ox, oy) => {
    ctx.save(); ctx.translate(ox, oy);
    // pilasters between bays: raised columns with a lit edge
    for (let x = 0; x < S; x += BAY) {
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - 6, 0, 12, S);
      ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(x - 6, 0, 2, S);
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x + 6, 0, 3, S);
    }
    // storey ledges: highlight on top, deep shadow underneath
    for (let y = 0; y < S; y += STOREY) {
      ctx.fillStyle = 'rgba(8,8,12,.95)'; ctx.fillRect(0, y, S, 7);
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(0, y, S, 1);
      const g = ctx.createLinearGradient(0, y + 7, 0, y + 17); g.addColorStop(0, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, y + 7, S, 10);
    }
    // windows
    for (const w of windows) {
      ctx.fillStyle = '#07080b'; ctx.fillRect(w.x - 2, w.y - 2, w.w + 4, w.h + 4);       // frame recess
      if (w.lit) {
        const warm = w.warm < .6 ? [255, 244, 222] : w.warm < .85 ? [228, 240, 255] : [255, 230, 190];
        const col = a => `rgba(${warm[0]},${warm[1]},${warm[2]},${a})`;
        ctx.save(); ctx.shadowColor = col(.9 * w.lit); ctx.shadowBlur = 18 * w.lit;
        const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.h); g.addColorStop(0, col(.75 * w.lit)); g.addColorStop(1, col(w.lit));
        ctx.fillStyle = g;
        if (w.half) ctx.fillRect(w.x, w.y + w.h * .45, w.w, w.h * .55); else ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.restore();
        if (w.half) { ctx.fillStyle = '#0c0e13'; ctx.fillRect(w.x, w.y, w.w, w.h * .45); }
        if (w.blinds) { ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let by = w.y + 3; by < w.y + w.h; by += 4) ctx.fillRect(w.x, by, w.w, 1.5); }
        if (w.figure) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.arc(w.x + w.w * .55, w.y + w.h * .5, 3.5, 0, 7); ctx.fill(); ctx.fillRect(w.x + w.w * .55 - 5, w.y + w.h * .62, 10, w.h * .38); }
        // light spill on the sill
        const s = ctx.createLinearGradient(0, w.y + w.h, 0, w.y + w.h + 8); s.addColorStop(0, col(.18 * w.lit)); s.addColorStop(1, col(0));
        ctx.fillStyle = s; ctx.fillRect(w.x - 3, w.y + w.h + 2, w.w + 6, 8);
      } else {
        const g = ctx.createLinearGradient(w.x, w.y, w.x + w.w, w.y + w.h); g.addColorStop(0, '#1a1f2a'); g.addColorStop(.5, '#0d1016'); g.addColorStop(1, '#141822');
        ctx.fillStyle = g; ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.beginPath(); ctx.moveTo(w.x, w.y + w.h * .7); ctx.lineTo(w.x + w.w * .6, w.y); ctx.lineTo(w.x + w.w * .8, w.y); ctx.lineTo(w.x, w.y + w.h * .95); ctx.fill();   // reflection
      }
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(w.x + w.w / 2 - .5, w.y, 1, w.h);          // mullion
      ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(w.x - 2, w.y + w.h + 2, w.w + 4, 1);   // sill
    }
    // air-conditioning units under some windows
    for (const u of units) {
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(u.x + 2, u.y + 2, 24, 8);
      ctx.fillStyle = '#1d2027'; ctx.fillRect(u.x, u.y, 24, 8);
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(u.x, u.y, 24, 1);
      ctx.fillStyle = 'rgba(0,0,0,.45)'; for (let vx = u.x + 3; vx < u.x + 22; vx += 3) ctx.fillRect(vx, u.y + 2, 1, 5);
    }
    // drain pipes running the full height
    for (const p of pipes) {
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(p.x + 2, 0, 6, S);
      const g = ctx.createLinearGradient(p.x, 0, p.x + 6, 0); g.addColorStop(0, '#2a2e37'); g.addColorStop(.4, '#3a3f4a'); g.addColorStop(1, '#16181d');
      ctx.fillStyle = g; ctx.fillRect(p.x, 0, 6, S);
      for (let y = 30; y < S; y += STOREY) { ctx.fillStyle = '#111317'; ctx.fillRect(p.x - 1, y, 8, 3); }
    }
    ctx.restore();
  };
  for (let oy = 0; oy < 3; oy++) for (let ox = 0; ox < 3; ox++) draw(ox * S, oy * S);

  const out = document.getElementById('out'), o = out.getContext('2d');
  o.clearRect(0, 0, S, S); o.drawImage(c, S, S, S, S, 0, 0, S, S);
  const url = out.toDataURL('image/webp', .9);
  document.getElementById('dl').href = url;
  document.getElementById('tiled').style.backgroundImage = `url(${url})`;
  return url;
}
window.render = render;
document.getElementById('go').onclick = () => render(+document.getElementById('seed').value);
render(11);
</script>
</body>
</html>
